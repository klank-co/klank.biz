<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klank Corp</title>
<link rel="icon" href="robot.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0e; color: #e9e6df;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
  }
  main { display: flex; flex-direction: column; align-items: flex-start; gap: 44px; padding: 16px; }
  .mark { display: flex; align-items: flex-end; gap: 36px; }
  .mark svg { width: min(200px, 35vw); height: min(196px, 34.3vw); flex: none; }
  .name { font-size: min(68px, 12vw); line-height: 1.02; font-weight: 800; -webkit-text-stroke: 2px currentColor; letter-spacing: 0.08em; text-transform: uppercase; }
  .links { align-self: center; display: flex; align-items: center; gap: 14px; color: #8a867e; font-size: 16px; }
  .bolt { width: 24px; height: 34px; flex: none; position: relative; top: 3px; }
  a { color: #8a867e; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-decoration: underline dotted rgba(138, 134, 126, 0.45); text-underline-offset: 5px; }
  a:hover { color: #e9e6df; }
  .eye { animation: blink 6s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
  .bolt.shake { animation: shake 0.45s; }
  @keyframes shake {
    0%, 100% { transform: rotate(0) translateX(0); }
    20% { transform: rotate(-14deg) translateX(-2px); }
    40% { transform: rotate(12deg) translateX(2px); }
    60% { transform: rotate(-8deg) translateX(-1px); }
    80% { transform: rotate(5deg) translateX(1px); }
  }
  @media (max-width: 600px) {
    main { align-items: center; gap: 32px; }
    .mark { flex-direction: column; align-items: center; gap: 20px; }
    .mark svg { width: 150px; height: 147px; }
    .name { font-size: 52px; text-align: center; -webkit-text-stroke: 1.5px currentColor; }
    .links { flex-direction: column; gap: 10px; }
    .bolt { top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .eye, .bolt.shake { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="5 1 54 53" role="img" aria-label="A robot">
      <line x1="32" y1="6" x2="32" y2="14" stroke="#c9c4b8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="5" r="3.5" fill="#d23c3c"/>
      <rect x="6" y="26" width="6" height="14" rx="2" fill="#8a857b"/>
      <rect x="52" y="26" width="6" height="14" rx="2" fill="#8a857b"/>
      <rect x="10" y="14" width="44" height="40" rx="9" fill="#d9d4c7"/>
      <rect x="16" y="22" width="32" height="18" rx="5" fill="#1b1b20"/>
      <rect class="eye" x="21" y="27" width="7" height="8" rx="2" fill="#7fe0ff"/>
      <rect class="eye" x="36" y="27" width="7" height="8" rx="2" fill="#7fe0ff"/>
      <rect x="22" y="45" width="20" height="4" rx="2" fill="#8a857b"/>
    </svg>
    <div class="name">Klank<br>Corp</div>
  </div>
  <div class="links">
    <a href="https://mrklanky.app/">mrklanky.app</a>
    <svg class="bolt" viewBox="0 0 20 28" aria-hidden="true"><polygon points="8,0 1,16 8,16 5,28 19,9 11,9 18,0" fill="#ffcc00"/></svg>
    <a href="mailto:perp@klank.biz">perp@klank.biz</a>
  </div>
</main>
<script>
  // A click on a link shakes the bolt; a web link waits for the shake, then opens.
  const bolt = document.querySelector('.bolt');
  for (const link of document.querySelectorAll('.links a')) {
    link.addEventListener('click', event => {
      bolt.classList.remove('shake');
      void bolt.getBoundingClientRect(); // restart the animation
      bolt.classList.add('shake');
      if (link.protocol.startsWith('http') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        event.preventDefault();
        setTimeout(() => { location.href = link.href; }, 450);
      }
    });
  }
</script>
</body>
</html>
